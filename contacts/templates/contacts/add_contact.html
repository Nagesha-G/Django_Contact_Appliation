{% load static %}

<!DOCTYPE html>

<html>
<head>
    <title>Add Contact</title>
    <link rel="stylesheet" href="{% static 'contacts/style.css' %}">
</head>

<body>

<div class="container">


<nav class="navbar">
    <a href="{% url 'home' %}">🏠 Home</a>
    <a href="{% url 'contact_list' %}">👥 Contacts</a>
</nav>

<div class="form-card">

    <h1>Add Contact</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-primary" type="submit">
            Save Contact
        </button>

        <a
            class="btn btn-secondary"
            href="{% url 'contact_list' %}"
        >
            Cancel
        </a>

    </form>

</div>


</div>

</body>
</html>
